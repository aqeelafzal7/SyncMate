name: 📱 Build Android APK (SyncMate)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 22 (Required by Capacitor 6+)
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java 21 (Required for Capacitor Android release 21)
      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. Setup Android SDK
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install project dependencies
      - name: 📦 Install Dependencies
        run: npm install

      # 6. Build production web bundle (Vite dist)
      # 6. Build production web bundle (Vite dist)
      - name: 🛠️ Build Web Bundle
        env:
          VITE_GEMINI_SYSTEM_API_KEY: ${{ secrets.VITE_GEMINI_SYSTEM_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: npm run build

      # 7. Add & Sync Capacitor Android project
      # 7. Download Logo & Sync Capacitor Android
      - name: 🔄 Capacitor Sync Android & Icons
        run: |
          npm install -g @capacitor/assets
          mkdir -p assets
          curl -L "https://i.ibb.co/PztwKQdM/Sync-Mate.png" -o assets/icon.png
          npx cap add android || true
          npx @capacitor/assets generate --android
          npx cap copy android
          npx cap sync android
      # 8. Grant execute permission for Gradle wrapper
      - name: 🔑 Chmod Gradle Wrapper
        run: |
          if [ -d "android" ]; then
            chmod +x android/gradlew || true
          fi
      # 9. Build Debug APK using Gradle
      - name: 🏗️ Compile Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
      # 10. Upload generated APK as a GitHub Download Artifact
      - name: 📤 Upload SyncMate APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncMate-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
