name: 📱 Build Android APK (SyncMate)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Setup Java 17 for Gradle Android compilation
      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Setup Android SDK
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install project dependencies
      - name: 📦 Install Dependencies
        run: npm ci

      # 6. Build production web bundle (Vite dist)
      - name: 🛠️ Build Web Bundle
        env:
          VITE_GEMINI_SYSTEM_API_KEY: ${{ secrets.VITE_GEMINI_SYSTEM_API_KEY }}
        run: npm run build

      # 7. Add & Sync Capacitor Android project
      - name: 🔄 Capacitor Sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      # 8. Grant execute permission for Gradle wrapper
      - name: 🔑 Chmod Gradle Wrapper
        run: chmod +x android/gradlew

      # 9. Build Debug APK using Gradle
      - name: 🏗️ Compile Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # 10. Upload generated APK as a GitHub Download Artifact
      - name: 📤 Upload SyncMate APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncMate-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
